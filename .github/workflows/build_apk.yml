name: Gerar APK Android

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite disparar a geração do APK manualmente com 1 clique

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Configurar ambiente e gerar debug.keystore
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env || touch .env
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Compilar APK de Debug
        run: gradle assembleDebug --stacktrace

      - name: Disponibilizar APK para Download (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: GestorDeAtas-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
